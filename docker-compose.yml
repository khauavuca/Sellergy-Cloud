name: sellergy_cloud

services:
  postgres:
    image: postgres:16-alpine
    container_name: sellergy_cloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sellergy_cloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sellergy_cloud-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - postgres
    networks:
      - sellergy_cloud-network

  redis:
    image: redis:7-alpine
    container_name: sellergy_cloud-redis
    restart: unless-stopped
    # Senha obrigatoria (REDIS_PASSWORD no .env).
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sellergy_cloud-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: sellergy_cloud-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - sellergy_cloud-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sellergy_cloud-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Dentro do Docker o backend fala com o MinIO pelo nome do servico.
      MINIO_ENDPOINT: http://minio:9000
      # PUBLIC_ENDPOINT e o host que o NAVEGADOR usa nas URLs assinadas —
      # sem isso, cai no ENDPOINT acima (minio:9000), que o navegador nao
      # resolve, e as fotos aparecem quebradas. Em prod, trocar pelo
      # dominio publico do MinIO (ver DEPLOY.md).
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:3333"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sellergy_cloud-network
    command: sh -c "npx prisma migrate deploy && npm run dev"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sellergy_cloud-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Dentro do Docker o backend fala com o MinIO pelo nome do servico.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sellergy_cloud-network
    command: node src/worker.js

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sellergy_cloud-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sellergy_cloud-network

  # Painel admin (crm.sellergycloud.com) servido do PC pelo tunel do Cloudflare.
  # Gere antes com `npm run build:painel` no frontend. So sobe com --profile painel.
  painel:
    image: nginx:1.27-alpine
    container_name: sellergy_cloud-painel
    restart: unless-stopped
    profiles: ["painel"]
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./frontend/dist-painel:/usr/share/nginx/html:ro
      - ./frontend/nginx-painel.conf:/etc/nginx/conf.d/default.conf:ro

  # Central de Ajuda (ajuda.sellergycloud.com), publica. O tunel do Cloudflare
  # leva ajuda.sellergycloud.com -> http://localhost:8089.
  # Gere antes com `npm run build` dentro de ajuda/. So sobe com --profile ajuda.
  ajuda:
    image: nginx:1.27-alpine
    container_name: sellergy_cloud-ajuda
    restart: unless-stopped
    profiles: ["ajuda"]
    ports:
      - "127.0.0.1:8089:80"
    volumes:
      - ./ajuda/.vitepress/dist:/usr/share/nginx/html:ro
      - ./ajuda/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  ngrok:
    image: ngrok/ngrok:latest
    container_name: sellergy_cloud-ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: http host.docker.internal:${BACKEND_PORT} --url=${NGROK_DOMAIN}
    ports:
      - "127.0.0.1:4040:4040"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sellergy_cloud-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  sellergy_cloud-network:
    driver: bridge
